<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReSell · tracker de revenda</title>
  <meta name="description" content="App simples para gerir uma operação de revenda: custo real, margem, lucro e dias até vender." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">

    <!-- Cabeçalho + resumo geral -->
    <header class="topo">
      <div class="marca">
        <h1>ReSell<span class="ponto">.</span></h1>
        <span class="tagline">tracker de revenda</span>
      </div>

      <div class="cartoes">
        <div class="cartao">
          <span class="cartao-label">Investido</span>
          <span class="cartao-valor" id="stat-investido">€0,00</span>
        </div>
        <div class="cartao">
          <span class="cartao-label">Em stock</span>
          <span class="cartao-valor" id="stat-stock">€0,00</span>
        </div>
        <div class="cartao">
          <span class="cartao-label">Receita</span>
          <span class="cartao-valor" id="stat-receita">€0,00</span>
        </div>
        <div class="cartao">
          <span class="cartao-label">Lucro</span>
          <span class="cartao-valor" id="stat-lucro">€0,00</span>
        </div>
        <div class="cartao destaque">
          <span class="cartao-label">Lucro por pessoa</span>
          <span class="cartao-valor" id="stat-pessoa">€0,00</span>
        </div>
      </div>

      <div class="barra-acoes">
        <label class="campo inline">
          <span>Sócios</span>
          <input type="number" id="socios" class="num pequeno" min="1" step="1" value="2" />
        </label>
        <button class="btn" id="btn-exportar">Exportar backup</button>
        <button class="btn" id="btn-importar">Importar</button>
        <input type="file" id="ficheiro-import" accept="application/json" hidden />
      </div>
    </header>

    <!-- Lucro por categoria -->
    <section class="bloco" id="bloco-categorias">
      <h2>Lucro por categoria</h2>
      <div id="cat-breakdown" class="categorias"></div>
    </section>

    <!-- Novo pedido -->
    <section class="bloco">
      <h2>Novo pedido</h2>
      <div class="form-novo">
        <label class="campo">
          <span>Nome do pedido</span>
          <input type="text" id="novo-nome" placeholder="ex: Lote 02 — futebol" />
        </label>
        <label class="campo">
          <span>Data compra</span>
          <input type="date" id="novo-compra" />
        </label>
        <label class="campo">
          <span>Data chegada</span>
          <input type="date" id="novo-chegada" />
        </label>
        <label class="campo">
          <span>Taxa PayPal (€)</span>
          <input type="number" id="novo-paypal" class="num" step="0.01" value="3.99" />
        </label>
        <label class="campo">
          <span>Saco / peça (€)</span>
          <input type="number" id="novo-saco" class="num" step="0.01" value="0.17" />
        </label>
        <button class="btn primario" id="btn-criar">+ Criar pedido</button>
      </div>
    </section>

    <!-- Lista de pedidos -->
    <section class="bloco">
      <h2>Pedidos</h2>
      <div id="lista"></div>
    </section>

    <footer class="rodape">
      JavaScript puro · sem dependências · os dados ficam no teu browser
    </footer>
  </div>

  <!-- Sugestões de categoria (livre: podes escrever qualquer uma) -->
  <datalist id="categorias">
    <option value="Camisa de futebol"></option>
    <option value="Polo"></option>
    <option value="Relógio"></option>
    <option value="Camisola"></option>
    <option value="Acessório"></option>
  </datalist>

  <script src="app.js"></script>
</body>
</html>
